server:
  # Detras de nginx, la IP de quien pide viene en X-Forwarded-For. "native"
  # solo la cree cuando la peticion llega desde una red interna (el proxy):
  # de otro modo cualquiera podria inventarse una IP y saltarse el freno de
  # intentos de login.
  forward-headers-strategy: native

# Documentacion de la API. Apagada salvo que se pida: describe cada endpoint y
# sus parametros, que es justo el mapa que necesita quien quiere atacar.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/omnirest-db?stringtype=unspecified}
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:adal}
    password: ${DB_PASSWORD}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # La base ya existia con el esquema hasta V4 aplicado a mano. El baseline
    # marca ese punto de partida, para que Flyway solo aplique lo que venga
    # despues en vez de fallar al encontrar tablas que no creo el.
    baseline-on-migrate: true
    baseline-version: 4
    baseline-description: esquema existente antes de Flyway

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Al recorrer una lista (productos -> categoria, receta -> ingrediente),
        # Hibernate trae lo relacionado en lotes de hasta 50 en vez de una
        # consulta por elemento. Con la base remota cada consulta cuesta.
        default_batch_fetch_size: 50

jwt:
  secret: ${JWT_SECRET}
  expiration: 14400000 # 4 horas
  # Clientes y repartidores: su acceso solo alcanza su propia ficha, y pedirles
  # un codigo cada 4 horas a media jornada de reparto no tiene sentido.
  expiration-cuenta: 2592000000 # 30 dias

bot:
  secret: ${BOT_SECRET}

omnirest:
  # Desde donde abren el sitio los clientes y los repartidores. Con esto se
  # arman los enlaces que salen por WhatsApp, asi que tiene que ser una
  # direccion publica: con localhost el enlace no abre en ningun telefono.
  url-publica: ${PUBLIC_WEB_URL:http://localhost:4200}

  # Plan con el que nace un restaurante nuevo. En desarrollo se pone PRO desde
  # el .env; en produccion se deja el valor conservador.
  plan-por-defecto: ${PLAN_POR_DEFECTO:INICIAL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

whatsapp:
  service-url: ${WHATSAPP_URL:http://localhost:4000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Webhook de Connect (pagos de clientes a los restaurantes). Es otro endpoint
  # en el panel de Stripe, con su propio secreto de firma.
  # Llave de la plataforma para Connect (cuentas de los restaurantes y sus cobros).
  # Aparte de la de la renta para poder usar la de prueba sin tocar la otra.
  connect-secret-key: ${STRIPE_CONNECT_SECRET_KEY:}
  # Llave publica de la plataforma: la usa el menu en linea para el formulario de tarjeta.
  connect-publishable-key: ${STRIPE_CONNECT_PUBLISHABLE_KEY:}
  connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}

# Asistente operativo. La llave maestra (32 bytes en base64) cifra las llaves
# de IA que pone cada restaurante. Si se pierde, esas llaves no se pueden
# descifrar y cada restaurante tendra que volver a ponerlas.
asistente:
  llave-maestra: ${ASISTENTE_LLAVE_MAESTRA:}

# Pedidos de Rappi. El secreto lo da Rappi al registrar los webhooks; vacio
# apaga la integracion (los avisos se rechazan).
rappi:
  webhook-secret: ${RAPPI_WEBHOOK_SECRET:}

n8n:
  webhook-url: ${N8N_WEBHOOK_URL:https://automata.bitend.ai/webhook/omnirest-whatsapp}

app:
  brand-name: ${APP_BRAND_NAME:OmniRest}
  brand-origin: ${APP_BRAND_ORIGIN:omnirest}
